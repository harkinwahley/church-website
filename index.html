<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WAY OF GOD BIBLE MINISTRY</title>
    
    <!-- Speed Boost: Preconnect to external servers -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #021223;
            --secondary-color: #f8f9fa;
            --text-color: #343a40;
            --accent-color: #28a745;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            background-color: #031828;
            margin: 0;
        }

        /* Optimization: Ensure hero background doesn't block text rendering */
        .hero-section {
            background: #021223 linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('church building.jpg') center center / cover no-repeat;
            color: white;
            padding: 8rem 0;
            text-align: center;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
        }

        section {
            padding: 4rem 0;
            background-color: white;
            margin-bottom: 2rem;
            border-radius: 15px;
        }

        .event-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            background: #eee; /* Placeholder color while loading */
        }

        .social-icons a { color: white; font-size: 1.5rem; margin: 0 15px; }
        footer { background-color: #212529; color: rgba(255,255,255,0.7); padding: 3rem 0; }
    </style>
</head>
<body>

    <!-- Navbar & Hero (Same as before) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-blue sticky-top shadow-sm">
        <div class="container">
            <img src="-CHURCH LOGO-.jpg" height="40" width="40" alt="logo" class="rounded-circle me-2" loading="eager"> 
            <a class="navbar-brand" href="#home">THE WAY OF GOD BIBLE MINISTRY</a>
        </div>
    </nav>

    <section id="home" class="hero-section">
        <div class="container">
            <h1 class="display-3 fw-bold">THE WAY OF GOD BIBLE MINISTRY</h1>
            <p class="h4">Mountain of Praise</p>
            <a href="#events" class="btn btn-warning btn-lg mt-3">Join Us This Sunday!</a>
        </div>
    </section>

    <main class="container mt-5">
        <!-- Programs Section with Lazy Loading -->
        <section id="events">
            <div class="container">
                <h2 class="text-center mb-4">Church Programs</h2>
                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
                    <div class="col">
                        <div class="card h-100 border-0 shadow-sm">
                            <img src="SUNDAY SERVICE.jpg" class="event-image" alt="Sunday" loading="lazy" width="300" height="200">
                            <div class="card-body text-center">
                                <h5 class="fw-bold">Sunday Service</h5>
                                <p class="text-muted small">Sundays, 8:00 AM</p>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 border-0 shadow-sm">
                            <img src="Bible Study.jpg" class="event-image" alt="Bible Study" loading="lazy" width="300" height="200">
                            <div class="card-body text-center">
                                <h5 class="fw-bold">Bible Study</h5>
                                <p class="text-muted small">Wednesdays, 5:00 PM</p>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 border-0 shadow-sm">
                            <img src="4b0ab2bc4e9356773cae8fd23db455a5.jpg" class="event-image" alt="Prayer" loading="lazy" width="300" height="200">
                            <div class="card-body text-center">
                                <h5 class="fw-bold">Prayer Meeting</h5>
                                <p class="text-muted small">3rd Week: Wed/Thu 5pm, Fri Vigil</p>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 border-0 shadow-sm">
                            <img src="Gba pada.jpg" class="event-image" alt="Gba Pada" loading="lazy" width="300" height="200">
                            <div class="card-body text-center">
                                <h5 class="fw-bold">Gba Pada</h5>
                                <p class="text-muted small">Last Tue: 9am - 12pm</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer & Scripts remain same -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
